[env:esp32-c6-generic]
platform = espressif32
board = esp32-c6-devkitc-1  ; 使用一个最接近的开发板作为基础
framework = espidf

; 硬件参数配置
; board_build.mcu = esp32c6
; board_build.flash_size = 4MB       ; 根据实际模块的 Flash 大小调整
; board_build.flash_mode = dio        ; 根据实际 Flash 芯片规格调整
; board_build.ram_size = 320KB        ; 根据模块实际 RAM 配置

; 连接配置
monitor_speed = 115200

; WiFi 6/6E 关键配置
build_flags = 
    -DCONFIG_ESP_WIFI_11AX_ENABLED=y    ; 启用 802.11ax
    -DCONFIG_ESP_WIFI_11N_ENABLED=y     ; 启用 802.11n
    -DCONFIG_ESP_PHY_ENABLE_USB=y       ; USB PHY 校准
    -DCONFIG_ESP_WIFI_CHANNEL_MAX=13    ; 2.4GHz 最大信道
    -DCONFIG_ESP_WIFI_AMPDU_ENABLED=y   ; 启用帧聚合

; 分区表配置（可选）
; board_build.partitions = no_ota.csv     ; 根据分区需求调整

; 监控配置
monitor_filters = direct                ; 禁用 PlatformIO 的默认过滤器